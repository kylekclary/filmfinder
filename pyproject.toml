[project]
name = "film-etl"
version = "0.1.0"
description = "Scrape public Letterboxd lists, enrich via OMDb/TMDB/Wikidata, load to SQLite and Parquet."
readme = "README.md"
authors = [
    { name = "kyleclary", email = "kkc7904@nyu.edu" }
]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "lxml>=6.1.3",
    "pandas>=3.0.6",
    "plotly>=7.1.0",
    "pyarrow>=25.0.1",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "streamlit>=1.64.0",
    "typer>=0.27.2",
    "vadersentiment>=3.3.2",
]

[project.scripts]
film-etl = "film_etl.cli:app"

[build-system]
requires = ["uv_build>=0.12.20,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]
