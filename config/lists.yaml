# Letterboxd lists to scrape. Public lists only; max_films caps how far we paginate.
lists:
  - url: https://letterboxd.com/official/list/letterboxds-top-500-films/
    name: Letterboxd's Top 500 Films
    max_films: 30

scrape:
  # Sent in the User-Agent so site operators can reach whoever runs the scraper.
  contact: https://github.com/kylekclary/filmfinder
  delay_min_s: 1.0
  delay_max_s: 2.0
  max_retries: 4
  reviews_per_film: 12

# Relative paths resolve against the directory you run film-etl from.
paths:
  raw: data/raw
  processed: data/processed
  fixtures: tests/fixtures
